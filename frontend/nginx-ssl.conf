# Production Nginx Configuration with SSL (HTTPS) & Rate Limiting

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_status 429;

# --- SEO routing (keep in step with src/utils/programmaticSeoConfig.js and src/App.jsx; `npm run seo:check` verifies) ---
# 1) Duplicate spellings get a real 301 to their primary URL instead of a second 200 page.
map $uri $seo_redirect {
    default                             "";
    /flats-in-delhi                     /properties-in-delhi;
    /properties-in-gurgaon              /properties-in-gurugram;
    /flats-in-gurugram                  /properties-in-gurugram;
    /flats-in-gurgaon                   /properties-in-gurugram;
    /flats-in-noida                     /properties-in-noida;
    /flats-for-rent-in-gurgaon          /flats-for-rent-in-gurugram;
    /flats-for-sale-in-gurgaon          /flats-for-sale-in-gurugram;
    /3-bhk-flats-in-gurugram            /3-bhk-flats-in-gurgaon;
    /2-bhk-flats-in-gurugram            /2-bhk-flats-in-gurgaon;
    /4-bhk-flats-in-gurugram            /4-bhk-flats-in-gurgaon;
    /luxury-villas-in-gurugram          /luxury-villas-in-gurgaon;
}

# 2) Routes the React app knows about. Anything else returns HTTP 404 (the SPA shell is still served, so visitors
#    see the in-app "page not found" screen, but crawlers get a real 404 instead of a soft 404).
#    Dynamic detail pages (/properties/<id|slug>, /projects/<id|slug>) cannot be validated here; the page itself is noindex
#    when the listing does not exist. A real 404 for those needs prerendering/SSR or an API lookup (see docs/SEO_DEPLOYMENT.md).
map $uri $spa_known {
    default 0;
    ~^/$ 1;
    ~^/(properties|projects)(/.*)?$ 1;
    ~^/property/?$ 1;
    ~^/(advisory|contact|terms|privacy|sitemap|entity-map|login|register)/?$ 1;
    ~^/(dashboard|admin)(/.*)?$ 1;
    ~^/properties-in-(delhi|gurugram|noida)/?$ 1;
    ~^/flats-for-rent-in-gurugram/?$ 1;
    ~^/flats-for-sale-in-(gurugram|delhi|noida|dwarka)/?$ 1;
    ~^/flats-for-rent-in-(delhi|noida)/?$ 1;
    ~^/(2|3|4)-bhk-flats-in-gurgaon/?$ 1;
    ~^/luxury-villas-in-(gurgaon|delhi)/?$ 1;
    ~^/builder-floors-in-(delhi|gurgaon)/?$ 1;
    ~^/commercial-properties-in-(gurgaon|delhi)/?$ 1;
}

# HTTP -> HTTPS Redirect & ACME Challenge
server {
    listen 80;
    server_name ${DOMAIN_NAME:-localhost};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Production Server
server {
    listen 443 ssl http2;
    server_name ${DOMAIN_NAME:-localhost};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME:-localhost}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME:-localhost}/privkey.pem;

    # Modern TLS Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Buffer & Request Limits
    client_max_body_size 15M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts & Connection Optimization
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65;
    send_timeout 15s;
    reset_timedout_connection on;

    # High Performance Static File Serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Open File Descriptor Cache (Drastically reduces TTFB for static SPA routes)
    open_file_cache max=5000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers with HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: /uploads/ https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.clarity.ms https://*.bing.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https: wss:; frame-src 'self' https://www.google.com https://www.googletagmanager.com; frame-ancestors 'none';" always;

    # Duplicate-URL redirects (see map $seo_redirect above) and legacy /properties/slug/<slug>, /projects/slug/<slug> URLs.
    if ($seo_redirect) {
        return 301 $seo_redirect;
    }
    rewrite ^/(properties|projects)/slug/([^/]+)/?$ /$1/$2 permanent;

    # Rate-limited Auth Endpoints
    location ^~ /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8080/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # General API Proxy
    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Sitemap XML proxy to backend with static file fallback
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static_sitemap;
    }

    location @static_sitemap {
        try_files /sitemap.xml =404;
    }

    # Uploads directory proxy with static build fallback
    location ^~ /uploads/ {
        root /usr/share/nginx/html;
        try_files $uri @backend_uploads;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location @backend_uploads {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Internal Health check endpoint
    location ^~ /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA routing fallback: known routes get index.html with 200, unknown URLs get a real 404 (same body, so users still
    # see the app's not-found page). `error_page 404 /index.html` keeps the 404 status code.
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        if ($spa_known = 0) {
            return 404;
        }
        try_files /index.html =404;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
