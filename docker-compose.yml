version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # MySQL Database Service (Private Database Network Only)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0.36
    container_name: keystone_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-keystonedb}
      MYSQL_USER: ${DB_USERNAME:-keystone_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-keystone_secure_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-keystone_root_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    expose:
      - "3306"
    # Port 3306 is explicitly NOT bound to host (0.0.0.0) for security
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-keystone_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Spring Boot Backend Service (Bridges Frontend & Database Networks)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keystone_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-keystonedb}
      DB_USERNAME: ${DB_USERNAME:-keystone_user}
      DB_PASSWORD: ${DB_PASSWORD:-keystone_secure_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      UPLOAD_DIR: /app/uploads
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-Root}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-877916588632514}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-81UKRoZlSzOgkntxnN7Jdf9e4_A}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,https://${DOMAIN_NAME:-localhost}}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-keystonerealtyhepldesk@gmail.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-KeystoneAdmin2026!}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Keystone Executive Admin}
      INITIAL_ADMIN_PHONE: ${INITIAL_ADMIN_PHONE:-9911956274}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - frontend_net
      - backend_net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ----------------------------------------------------------------------------
  # React Frontend & Nginx Reverse Proxy (Public Entrypoint)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keystone_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Certbot SSL Renewal Service (Optional Profile)
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: keystone_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - ssl

volumes:
  mysql_data:
    name: keystone_mysql_data
  uploads_data:
    name: keystone_uploads_data
  certbot_conf:
    name: keystone_certbot_conf
  certbot_www:
    name: keystone_certbot_www

networks:
  frontend_net:
    name: keystone_frontend_net
    driver: bridge
  backend_net:
    name: keystone_backend_net
    driver: bridge
    internal: true # Isolates database network from external routing
