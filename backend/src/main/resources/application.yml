spring:
  application:
    name: keystone-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}
  admin:
    initial-email: ${INITIAL_ADMIN_EMAIL:keystonexhelpdesk@gmail.com}
    initial-password: ${INITIAL_ADMIN_PASSWORD}
    initial-name: ${INITIAL_ADMIN_NAME:Keystone Executive Admin}
    initial-phone: ${INITIAL_ADMIN_PHONE:9911956274}
