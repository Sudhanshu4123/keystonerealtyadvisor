spring:
  application:
    name: keystone-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:keystonehelpdesk@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:omuubbfkbprevhtw}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}
  admin:
    initial-email: ${INITIAL_ADMIN_EMAIL:keystonehelpdesk@gmail.com}
    initial-password: ${INITIAL_ADMIN_PASSWORD:KeystoneAdmin2026!}
    initial-name: ${INITIAL_ADMIN_NAME:Keystone Executive Admin}
    initial-phone: ${INITIAL_ADMIN_PHONE:9911956274}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  reset-password:
    expiration-minutes: ${RESET_PASSWORD_EXPIRATION_MINUTES:15}
