spring:
  application:
    name: keystone-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}
  admin:
    initial-email: ${INITIAL_ADMIN_EMAIL:keystonerealtyhepldesk@gmail.com}
    initial-password: ${INITIAL_ADMIN_PASSWORD:KeystoneAdmin2026!}
    initial-name: ${INITIAL_ADMIN_NAME:Keystone Executive Admin}
    initial-phone: ${INITIAL_ADMIN_PHONE:9911956274}
